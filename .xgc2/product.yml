schema: xgc2.product.v1
id: xgc2-ros-jazzy-fs150-description
name: XGC2 ROS Jazzy FS150 Description
version: 0.1.0-1
kind: ros2-apt
summary: ROS 2 Jazzy visual description assets for the XGC2 FS150 airframe.
ros:
  distro: jazzy
  packages:
  - fs150_description
apt:
  distribution: noble
  install:
  - ros-jazzy-xgc2-fs150-description
  packages:
  - ros-jazzy-xgc2-fs150-description
  package_architectures:
    ros-jazzy-xgc2-fs150-description:
    - amd64
    - arm64
  depends:
  - ros-jazzy-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-jazzy-xgc2-fs150-description

    '
  smoke_test: 'source /opt/ros/jazzy/setup.bash

    ros2 pkg prefix fs150_description

    test -f /opt/ros/jazzy/share/fs150_description/urdf/fs150_visual.urdf

    '
ownership:
  paths:
  - /opt/ros/jazzy/share/fs150_description
  - /opt/ros/jazzy/share/ament_index/resource_index/packages/fs150_description
  - /opt/ros/jazzy/share/ament_index/resource_index/package_run_dependencies/fs150_description
  - /opt/ros/jazzy/share/ament_index/resource_index/parent_prefix_path/fs150_description
release:
  repository: XGC-Team/xgc2-fs150-description
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    noble: 0.1.0-1
