schema: xgc2.product.v1
id: xgc2-fs150-description
name: XGC2 FS150 Description
version: 0.1.0-9
kind: ros1-apt
summary: ROS Noetic visual description assets for the XGC2 FS150 airframe.
ros:
  distro: noetic
  packages:
  - fs150_description
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-fs150-description
  packages:
  - ros-noetic-xgc2-fs150-description
  package_architectures:
    ros-noetic-xgc2-fs150-description:
    - amd64
    - arm64
  depends:
  - ros-noetic-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-fs150-description

    '
  smoke_test: 'rospack find fs150_description

    test -f /opt/ros/noetic/share/fs150_description/urdf/fs150_visual.urdf

    '
ownership:
  paths:
  - /opt/ros/noetic/share/fs150_description
release:
  repository: XGC-Team/xgc2-fs150-description
  ref: noetic
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    focal: 0.1.0-9
